plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// 此模块会被根工程及两个独立 App 工程复用，隔离其构建产物以避免并发构建冲突。
layout.buildDirectory.set(new File(projectDir, "build/${rootProject.name}"))

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

dependencies {
    // 生成代码的公开方法引用 protobuf 类型，因此对消费者传递暴露运行时。
    api 'com.google.protobuf:protobuf-javalite:3.25.5'
}
